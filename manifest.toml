packaging_format = 2

id = "automad"
name = "Automad"
description.en = "Flat-file content management system and template engine"
description.fr = "Système de gestion de contenu de fichiers plats et un moteur de modèles"

version = "2.0.0~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://automad.org/"
admindoc = "https://automad.org/getting-started"
userdoc = "https://automad.org/user-guide"
code = "https://github.com/marcantondahmen/automad"

[integration]
yunohost = ">= 12.1.7"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/automad"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
        [resources.sources.main]
        url = "https://github.com/marcantondahmen/automad/archive/refs/tags/2.0.0-alpha.37.tar.gz"
        sha256 = "1a73006e659e94788e9266e7838312ae89134ea18e47a5da307001fe673330f9"
        autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "php8.2-gd, php8.2-zip, php8.2-curl"
